                                port1:
                                  $ref: '#/components/schemas/port'
                                port2:
                                  $ref: '#/components/schemas/port'
                                port3:
                                  $ref: '#/components/schemas/port'
                                reportPeriodMs:
                                  type: integer
                                servingMs:
                                  type: integer
                                siteName:
                                  type: string
                                timezone:
                                  type: string
              required:
                - shadow
      parameters:
        - schema:
            type: string
            default: application/json
          in: header
          name: content-type
          required: true
      description: "Update Device Shadow\n\nAny or or object keys parameters may be written to the device shadow. If the device is offline, any changes will be queued by the shadow and written to device when it is back online. "
    parameters: []
  /customer:
    get:
      summary: Customer GET Endpoint
      tags: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated_at:
                    type: string
                    description: Customer object updated date+time
                  created_at:
                    type: string
                    description: Customer object creation date+time
                  pubkeys:
                    type: object
                    required:
                      - key1
                    properties:
                      key1:
                        description: Device 1 public key
                        nullable: true
                        type: string
                      keg2:
                        description: Device 2 public key
                        nullable: true
                        type: string
                      keyn:
                        description: Device n public key
                        nullable: true
                        type: string
                  token:
                    type: string
                    description: Customer token
                  email:
                    type: string
                    description: Customer email address
                  app_id:
                    type: string
                    description: mDash application id specific to Kegtron
                  id:
                    type: string
                    description: CUSTOMER_KEY
                required:
                  - id
                  - app_id
                  - email
                  - token
                  - pubkeys
                  - created_at
                  - updated_at
              examples:
                'Example: Customer with two devices':
                  value:
                    id: 2SIK4J8MhccQsflmaQP4d54
                    app_id: UCzqkgYtz91FnYAIo0uulaA
                    email: user@example.com
                    token: pKPaC1kTQ8leL3ejsY4PkFi1uYyJfAEbfjhrXpmNgsGGCgmFM8q9n
                    pubkeys:
                      LKueHqA7xsR68tdYgv4JpO: {}
                      wgpxg9Y0PQjE8U7ZNGfz9v: {}
                    created_at: '2019-12-15T23:30:07.744123249Z'
                    updated_at: '2020-02-22T02:58:12.21228205Z'
      operationId: get-customer2
      description: |-
        Return Customer Object

        The primary use for this endpoint is to obtain a list of devices and respecitve DEVICE_PUBLIC_KEYs assigned to a customer. These device keys enable GET and POST calls to the /api/v2/m/device endpoints.
      security:
        - basic-auth: []
    parameters: []
components:
  schemas:
    port:
      title: port
      type: object
      description: Port-specific configuration parameters
      properties:
        beaconEna:
          type: integer
          description: Enable flashing beacon for this port
        calOffset:
          type: number
          description: 'Calibration offset %'
        volStart:
          type: integer
          description: Keg starting volume in mL
        volSize:
          type: integer
          description: Keg volume in mL
        userName:
          type: string
          description: User description of keg attached to this port
        userDesc:
          type: string
          description: User name of keg attached to this port
        state:
          type: integer
          description: For future use
        pulseCnt:
          type: integer
          description: Total pulses counted from flow meter since last reset
        lastServing:
          type: integer
          description: Volume of last measured serving in mL
        kegsServed:
          type: integer
          description: Count of kegs served on this port
        kFactor:
          type: integer
          description: 'Flow meter K-Factor. For factory use only. '
        drinkSize:
          type: integer
          description: Serving volume in mL. Used for servings remaining estimation.
        dateTapped:
          type: string
          description: "Date (UTC) this port's keg was last tapped"
        dateCleaned:
          type: string
          description: Date (UTC) this port was last cleaned
  securitySchemes:
    DEVICE_PUBLIC_KEY:
      name: access_token
      type: apiKey
      in: query
      description: "Insert valid 'DEVICE_PUBLIC_KEY'"
    basic-auth:
      type: http
      scheme: basic
      description: 'username:password'
