      description: "Return Device Object\n\nCalling this endpoint returns all device state information from the device shadow. \n\nNOTE:\n- Device ports are numbered 0,1,2,3 which correspond to user port numbers 1,2,3,4\n- Four port objects will always be returned\n- If shadow.state.reported.config.portCount < 4, the upper port objects can be ignored"
    post:
      summary: Device POST Endpoint
      operationId: post-m-device
      responses:
        '200':
          description: OK
      security:
        - DEVICE_PUBLIC_KEY: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                shadow:
                  type: object
                  required:
                    - state
                  properties:
                    state:
                      type: object
                      required:
                        - desired
                      properties:
                        desired:
                          type: object
                          required:
                            - config
                          properties:
                            config:
                              type: object
                              properties:
                                afterHoursAlertEmailEna:
                                  type: integer
                                afterHoursAlertSmsEna:
                                  type: integer
                                alertSmsToNumber:
