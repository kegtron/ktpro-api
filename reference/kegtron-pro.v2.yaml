      operationId: get-m-device
      security:
        - DEVICE_PUBLIC_KEY: []
      parameters:
        - schema:
            type: string
            default: application/json
          in: header
          name: content-type
          required: true
      description: |-
        Return Device Object

        Calling this endpoint returns all device state information from the device shadow. 

        NOTE:
        - Device ports are numbered 0,1,2,3 which correspond to user port numbers 1,2,3,4
        - Four port objects will always be returned
        - If shadow.state.reported.config.portCount < 4, the upper port objects can be ignored
    post:
      summary: Device POST
      operationId: post-m-device
      responses:
        '200':
          description: OK
      security:
        - DEVICE_PUBLIC_KEY: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                shadow:
                  type: object
                  required:
                    - state
                  properties:
                    state:
                      type: object
                      required:
                        - desired
                      properties:
