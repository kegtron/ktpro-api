                                bizHourTueStart:
                                  type: string
                                bizHourWedDuration:
                                  type: integer
                                bizHourWedStart:
                                  type: string
                                bleEna:
                                  type: integer
                                cleanDetectPeriodMs:
                                  type: integer
                                cleanEna:
                                  type: integer
                                  deprecated: true
                                cleaningDelay:
                                  type: integer
                                  description: Delay in minutes after which time cleaning mode will automatically be disabled
                                displayUnits:
                                  type: integer
                                  description: '0: Metric, 1: US Customary'
                                emptyThreshold:
                                  type: integer
                                emptyThresholdAlertEmailEna:
                                  type: integer
                                emptyThresholdAlertSmsEna:
                                  type: integer
                                humidityOffset:
                                  type: number
                                  description: Offset applied to all measurements
                                lowThreshold:
                                  type: integer
                                lowThresholdAlertEmailEna:
                                  type: integer
                                lowThresholdAlertSmsEna:
                                  type: integer
                                port0:
                                  $ref: '#/components/schemas/port-config'
                                port1:
                                  $ref: '#/components/schemas/port-config'
                                port2:
                                  $ref: '#/components/schemas/port-config'
                                port3:
                                  $ref: '#/components/schemas/port-config'
                                secWiFiPass:
                                  type: string
                                  description: Secondary WiFi password
                                secWiFiSSID:
                                  type: string
                                  description: Secondary WiFi SSID
                                servingMs:
                                  type: integer
                                  description: Time between servings in ms
                                siteName:
                                  type: string
                                  description: Site name
                                tempOffset:
                                  type: number
                                  description: Offset applied to all measurements
                                timezone:
                                  type: string
                                  description: Time Zone in GNU TZ format
                                timezoneLoc:
                                  type: string
                                  description: Time Zone Location
              required:
                - shadow
        description: ''
      parameters:
        - schema:
            type: string
            default: application/json
          in: header
          name: content-type
          required: true
          description: ''
      description: |-
        Update Device Shadow

        Any or or object keys parameters may be written to the device shadow. If the device is offline, any changes will be queued by the shadow and written to device when it is back online. 
    parameters: []
  /customer:
    get:
      summary: Customer GET
      tags: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated_at:
                    type: string
                    description: Customer object updated date+time
                  created_at:
                    type: string
                    description: Customer object creation date+time
                  pubkeys:
                    type: object
                    required:
                      - key1
                    properties:
                      key1:
                        description: Device 1 public key
                        nullable: true
                        type: string
                      key2:
                        description: Device 2 public key
                        nullable: true
                        type: string
                      keyn:
                        description: Device n public key
                        nullable: true
                        type: string
                  token:
                    type: string
                    description: Customer token
                  email:
                    type: string
                    description: Customer email address
                  app_id:
                    type: string
                    description: mDash application id specific to Kegtron
                  id:
                    type: string
                    description: CUSTOMER_KEY
                required:
                  - updated_at
                  - created_at
                  - pubkeys
                  - token
                  - email
                  - app_id
                  - id
              examples:
                'Example: Customer with two devices':
                  value:
                    id: 2SIK4J8MhccQsflmaQP4d54
                    app_id: UCzqkgYtz91FnYAIo0uulaA
                    email: user@example.com
                    token: pKPaC1kTQ8leL3ejsY4PkFi1uYyJfAEbfjhrXpmNgsGGCgmFM8q9n
                    pubkeys:
                      LKueHqA7xsR68tdYgv4JpO: {}
                      wgpxg9Y0PQjE8U7ZNGfz9v: {}
                    created_at: '2019-12-15T23:30:07.744123249Z'
                    updated_at: '2020-02-22T02:58:12.21228205Z'
      operationId: get-customer2
      description: |-
        Return Customer Object

        The primary use for this endpoint is to obtain a list of devices and respecitve DEVICE_PUBLIC_KEYs assigned to a customer. These device keys enable GET and POST calls to the /api/v2/m/device endpoints.

        This endpoint can be called in two different ways:
        1) Use basic auth with username:password
        2) Use the CUSTOMER_KEY* as the access_token

        Both methods return an identical customer object.

        * If you don't have the CUSTOMER_KEY, use method #1 (basic auth) to obtain the customer object. The 'token' value within this object is the CUSTOMER_KEY.
      security:
        - basic-auth: []
        - CUSTOMER_KEY: []
    parameters: []
    post:
      summary: Customer POST
      operationId: post-customer
      responses:
        '200':
          description: OK
      description: This endpoint allows modification of the Customer object metadata with account-specific info. All other keys within the Customer object are read-only.
      security:
        - CUSTOMER_KEY: []
      parameters:
        - schema:
            type: string
            default: application-json
          in: header
          name: content-type
          required: true
      requestBody:
        content:
          application/json:
            schema:
              description: ''
              type: object
              properties:
                cconfig:
                  type: object
                  description: Customer metadata object
                  properties:
                    bizDayStart:
                      type: string
                      description: 'Business day start time string in "HH:MM" 24 hour format'
                      default: '08:00'
              required:
                - cconfig
            examples:
              'Set start of biz day to 10:00am':
                value:
                  cconfig:
                    bizDayStart: '10:00'
        description: ''
  /api/v2/m/device/rpc/Kegtron.GetTempHumidity:
    post:
      summary: Get Temperature and Humidity RPC POST
      operationId: post-api-v2-m-device-rpc-Kegtron.GetTempHumidity
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                description: ''
                type: object
                properties:
                  temp:
                    type: number
                    description: Device temperature in degrees Celsius
                  humidity:
                    type: number
                    description: Device relative humdity percentage
                required:
                  - temp
                  - humidity
              examples:
                Example:
                  value:
                    temp: 24.0311
                    humidity: 56.849
      description: |-
        This remote procedure call (RPC) fetches the current temperature and humidity of the keg monitor device. It does not report temp/humdidity for specific ports.

        When called, the following shadow values are updated:

        - config_readonly.humidity
        - config_readonly.temp
      security:
        - DEVICE_PUBLIC_KEY: []
      parameters:
        - schema:
            type: string
            default: application-json
          in: header
          name: content-type
          required: true
  /api/v2/m/device/rpc/Kegtron.GetWiFiRssi:
    post:
      summary: Get WiFi RSSI RPC POST
      operationId: post-api-v2-m-device-rpc-Kegtron.GetWiFiRssi
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: integer
              examples:
                Example:
                  value: -47
      description: This remote procedure call (RPC) fetches the current WiFi Recevied Signal Strength Indicator (RSSI) as seen by the device. Larger values correspond to stronger signal strength (e.g. -30 is very good whereas -80 is very poor).
      security:
        - DEVICE_PUBLIC_KEY: []
      parameters:
        - schema:
            type: string
            default: application-json
          in: header
          name: content-type
          required: true
  /api/v2/m/device/rpc/Kegtron.CleanMode:
    post:
      summary: Set Cleaning Mode RPC POST
      operationId: post-api-v2-m-device-rpc-Kegtron.CleanMode
      responses:
        '200':
          description: 'true'
      description: |-
        This remote procedure call (RPC) configures the Cleaning Mode for the device.
        - When enabled, measurements are ignored on all ports. Cleaning is enabled for a duration defined by config.cleaningDelay after which time it is automatically disabled.
        - When disabled, all measurements behave normally

        When called, the following shadow values are updated:

        - config_readonly.cleanActive
      security:
        - DEVICE_PUBLIC_KEY: []
      parameters:
        - schema:
            type: string
            default: application-json
          in: header
          name: content-type
          required: true
      requestBody:
        content:
          application/json:
            schema:
              description: ''
              type: object
              properties:
                mode:
                  type: number
                  description: '1: enabed, 0: disabled'
              required:
                - mode
        description: Enable/disable cleaning mode using the 'mode' parameter
  /api/v2/m/device/rpc/Kegtron.ResetVolume:
    post:
      summary: Reset Volume RPC POST
      operationId: post-api-v2-m-device-rpc-Kegtron.ResetVolume
      responses:
        '200':
          description: 'true'
      description: |-
        This remote procedure call (RPC) initiates a keg volume reset on the target device for the specificed port. 

        When called, the following shadow values are updated as shown:

        - config_readonly.porti.pulseCnt = 0
        - config_readonly.porti.volDisp = 0
        - config_readonly.porti.volStart = config.volSize
        - config_readonly.porti.dateTapped = current date
      security:
        - DEVICE_PUBLIC_KEY: []
      parameters:
        - schema:
            type: string
            default: application-json
          in: header
          name: content-type
          required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                port:
                  type: integer
                  maximum: 3
                  description: 'Port number, e.g. port0, port1...'
                  minimum: 0
              required:
                - port
            examples:
              Reset port 1 (user port 2):
                value:
                  port: 1
        description: Port number 0..3 (corresponds to user port 1..4)
  /api/v2/m/device/rpc/Kegtron.ResetKegsServed:
    post:
      summary: Reset Kegs Served RPC POST
      operationId: post-api-v2-m-device-rpc-Kegtron.ResetKegsServed
      responses:
        '200':
          description: 'true'
      description: |
        This remote procedure call (RPC) initiates a reset of the kegs served counter on the target device for the specificed port. 

        When called, the following shadow value is updated as shown:

        - config_readonly.porti.kegsServed = 0
      security:
        - DEVICE_PUBLIC_KEY: []
      parameters:
        - schema:
            type: string
            default: application-json
          in: header
          name: content-type
          required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                port:
                  type: integer
                  maximum: 3
                  description: 'Port number, e.g. port0, port1...'
                  minimum: 0
              required:
                - port
            examples:
              Reset Port 2 (user port 3):
                value:
                  port: 2
        description: Port number 0..3 (corresponds to user port 1..4)
  /api/v2/m/device/rpc/Kegtron.UserOverride:
    post:
      summary: User Override RPC POST
      operationId: post-api-v2-m-device-rpc-Kegtron.UserOverride
      responses:
        '200':
          description: 'true'
      description: |
        This remote procedure call (RPC) initiates user-iniated overrides of specific shadow values on the target device for the specificed port. This method is used to prevent contention with firmware which can autonomously update these values.

        The following values can be updated via this RPC:

        - config_readonly.porti.dateTapped
        - config_readonly.porti.dateCleaned
        - config_readonly.porti.volStart
      security:
        - DEVICE_PUBLIC_KEY: []
      parameters:
        - schema:
            type: string
            default: application-json
          in: header
          name: content-type
          required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                state:
                  type: object
                  required:
                    - config_readonly
                  properties:
                    config_readonly:
                      type: object
                      required:
                        - porti
                      properties:
                        porti:
                          type: object
                          description: 'Port number, e.g. port0, port1...'
                          properties:
                            dateTapped:
                              type: string
                              description: Date Format yyyy/mm/dd
                            dateCleaned:
                              type: string
                              description: Date Format yyyy/mm/dd
                            volStart:
                              type: integer
                              description: Keg starting volume in mL
              required:
                - state
            examples:
              Set Port 0 keg starting volume to 10L:
                value:
                  state:
                    config_readonly:
                      port0:
                        volStart: 10000
        description: Replace 'i' with port number 0..3 (corresponds to user port 1..4)
