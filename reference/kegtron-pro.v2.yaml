components:
  schemas:
    port-config:
      title: port-config
      type: object
      description: Port-specific configuration parameters
      properties:
        abv:
          type: number
          description: Alcohol By Volume value % rating
        beaconEna:
          type: integer
          description: Enable flashing beacon for this port
        calOffset:
          type: number
          description: Calibration offset %
        userName:
          type: string
          description: User description of keg attached to this port
        userDesc:
          type: string
          description: User name of keg attached to this port
        drinkSize:
          type: integer
          description: Serving volume in mL. Used for servings remaining estimation.
        ibu:
          type: integer
          description: International Bittering Units rating
        maker:
          type: string
          description: 'Beverage manufacturer (e.g. brewery, winery, etc.)'
        state:
          type: integer
          description: For future use
        style:
          type: string
          description: 'Description of beverage classification (e.g. Pilsner, Merlot, etc.)'
        tapLabel:
          type: string
          description: Customer tap handle label (usually a number)
        volSize:
          type: integer
          description: Keg volume in mL
      x-examples: {}
  securitySchemes:
    DEVICE_PUBLIC_KEY:
      name: access_token
      type: apiKey
      in: query
      description: Insert valid 'DEVICE_PUBLIC_KEY'
    basic-auth:
      type: http
      scheme: basic
      description: 'username:password'
    CUSTOMER_KEY:
      name: access_token
      type: apiKey
      in: query
      description: Insert valid 'CUSTOMER_KEY'
  examples: {}
